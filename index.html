<head>
    <title>Plataforma para tener recomendaciones de peliculas</title> <!--HEAD ES DATA PARA EL NAVEGADOR NO PARA EL USUARIO - AQUI VA TITULOS CSS, CONFIGURACIÓN O META DATOS-->
    <!--EL TITLE ES EL QUE APARECE EN LA PESTAÑA DEL NAVEGADOR -->
</head>

<!--EL BODY CONTIENE TODO LO QUE EL USUARIO VA A VER -->
<body>

    <h1>BIENVENID@S</h1> <!--ESTO H1 ES EL HEADING O TITULO PRINCIPAL  Y VAN SUBIENDO PARA MENORES CATEGORIAS COMO H2 H3 ETC -->
    
    <p> A continuacón ingrese el tipo de peliculas que le gustan o que quisiera ver</p> <!--P ES PARA PARRAFOS DE TEXTO -->

    <style>

     body {

        text-align: center; /* CENTRA TODO EL CONTENIDO DE LA PAGINA */
     }

     img { /* IMG REPRESENTA TODAS LAS IMAGENES DE LA PAGINA */

        border-radius: 15px; /* REDONDEA LOS BORDES DE LA IMAGEN */

        box-shadow: 0px 0px 15px black; /* AGREGA UNA SOMBRA NEGRA */

        transition: 0.3s; /* HACE SUAVE LA ANIMACION */
     }

      img:hover { /* HOVER SE ACTIVA CUANDO EL MOUSE PASA ENCIMA */

       /* AGRANDA UN POCO LA IMAGEN */
       transform: scale(1.05);

       /* CAMBIA LA SOMBRA */
       box-shadow: 0px 0px 25px red;
      }

    </style>
    
    <style>

    body {

        text-align: center;

        color: white; /* CAMBIA EL COLOR DEL TEXTO */

        background: linear-gradient( /* CREA UN FONDO DEGRADADO */
            -45deg,
            #1e3c72,
            #2a5298,
            #000000,
            #434343
        );

        background-size: 400% 400%; /* HACE MAS GRANDE EL FONDO PARA PODER ANIMARLO */

        animation: moverFondo 10s ease infinite; /* ACTIVA LA ANIMACION DEL FONDO */
    }

    @keyframes moverFondo { /* KEYFRAMES CREA LA ANIMACION */

        0% {
            background-position: 0% 50%;
        }

        50% {
            background-position: 100% 50%;
        }

        100% {
            background-position: 0% 50%;
        }
    }

    </style>

    
   <!-- EL METHOD ES COMO SE ENVIAN LOS DATOS POR ENDE AQUI SE MANDAN LOS DATOS DENTRO DE LA URL -->
   <form action="#" method="get">  <!-- Action es lo que contendra la busqueda y # significa quedarse ahi mismo FORM ES QUIEN CONTIENE LA BUSQUEDA-->      
         
         <input type="text" placeholder="Buscar..." name="busqueda"> <!-- INPUT CREA UNA CAJA PARA ESCRIBIR TEXTO -->

         <button type="submit">Buscar</button> <!-- SE CREA UN BOTON CON FORMULARIO PARA ENVIAR -->

    </form>
